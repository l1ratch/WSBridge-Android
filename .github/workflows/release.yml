name: Release (Tag v*)

# Релизный сборщик. Запускается ТОЛЬКО пушем тега v0.2.0 и т.п.
# Создаёт GitHub Release с подписанным APK.
# Подпись: RELEASE_KEYSTORE_B64 + RELEASE_KEYSTORE_PASSWORD + RELEASE_KEY_ALIAS
# + RELEASE_KEY_PASSWORD в секретах; без них — debug-ключ (ставится, но не для
# обновления поверх старых релизных сборок).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + Build release APK
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" "WSBridge-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            "WSBridge-${{ github.ref_name }}.apk" \
            --title "WSBridge ${{ github.ref_name }}" \
            --notes "APK для Android. Ставится напрямую (без Play Store)." \
            --prerelease=false
