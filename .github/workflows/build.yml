name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Версия: ОДНА строка X.X.N из gradle.properties ───────────────
      # X.X — блок версии, N — номер сборки (0.3.0 = 0.3, сборка 0).
      # versionCode выводится из неё же (major*1e6 + minor*1e4 + patch),
      # отдельного счётчика нет — как и на iOS. Проверяем формат явно:
      # опечатка в строке иначе молча дала бы versionCode из нулей.
      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^[[:space:]]*wsb\.version[[:space:]]*=' gradle.properties | tail -n 1 | cut -d= -f2 | tr -d '[:space:]' || true)
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::wsb.version в gradle.properties должен быть X.X.N (например 0.3.0), получено: '$VERSION'"
            exit 1
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
          CODE=$(( MAJ * 1000000 + MIN * 10000 + PAT ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION, versionCode=$CODE"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + Build APK
        env:
          # Стабильная подпись: APK подписывается одним ключом из секретов,
          # поэтому новая сборка ставится ПОВЕРХ старой без удаления.
          # Отдельного BUILD_NUMBER больше нет: versionCode выводится из
          # wsb.version в Gradle, так что preview и релиз с одной версией
          # всегда несут один и тот же номер.
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/WSBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WSBridge-APK
          path: dist/*.apk
          if-no-files-found: error

      # Каждый пуш в main обновляет prerelease "preview" (как в WSBridge-iOS).
      # APK подписан стабильным ключом, а versionCode выводится из той же
      # wsb.version, что и у релиза, поэтому preview и релиз с одинаковой
      # версией ставятся друг поверх друга.
      # «code N» в notes — маркер: релизный guard читает его и не даёт
      # выпустить релиз с versionCode ниже уже опубликованного preview.
      - name: Update preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes 2>/dev/null || true
          git push origin :refs/tags/preview 2>/dev/null || true
          gh release create preview \
            dist/WSBridge.apk \
            --title "Preview (latest main)" \
            --notes "Дев-сборка с последнего пуша в main: ${{ steps.ver.outputs.version }} (code ${{ steps.ver.outputs.code }}). Для стабильных версий — Releases." \
            --prerelease

      # ── Авто-бамп последней цифры (гибкое версионирование) ──────────
      # Политика: X.X — блок версии, последняя цифра — номер превью-сборки,
      # и её двигает САМ CI после каждой успешной preview. Человек руками
      # трогает только X.X (новый блок) и релизный тег: завершённой версию
      # делает тег v*, а release.yml сверяет тег с wsb.version и не даёт
      # выпустить релиз с code ниже опубликованного preview.
      #
      # Коммит пушится GITHUB_TOKEN'ом: пуши этим токеном не триггерят
      # workflows, поэтому цикла «сборка → бамп → сборка» не возникает.
      # Перед бампом синхронизируемся с origin/main: если параллельная
      # сборка уже успела поднять цифру, считаем от неё, а не от своей
      # устаревшей версии (иначе пуш лёг бы non-fast-forward).
      - name: Bump build digit for next preview
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          CURRENT=$(grep -E '^[[:space:]]*wsb\.version[[:space:]]*=' gradle.properties | tail -n 1 | cut -d= -f2 | tr -d '[:space:]')
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          NEXT="$MAJ.$MIN.$((PAT + 1))"
          sed -i -E "s|^[[:space:]]*wsb\.version[[:space:]]*=.*|wsb.version=$NEXT|" gradle.properties
          git config user.name "wsb-ci"
          git config user.email "wsb-ci@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump build digit to $NEXT after preview $VERSION"
          git push origin HEAD:refs/heads/main
          echo "next preview will build as $NEXT"
