name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + Build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/WSBridge-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WSBridge-APK
          path: dist/*.apk
          if-no-files-found: error

      # Каждый пуш в main обновляет prerelease "preview" (как в WSBridge-iOS).
      - name: Update preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes 2>/dev/null || true
          git push origin :refs/tags/preview 2>/dev/null || true
          gh release create preview \
            dist/WSBridge-debug.apk \
            --title "Preview (latest main)" \
            --notes "Дев-сборка с последнего пуша в main. Для стабильных версий — Releases." \
            --prerelease
